name: Build Android APK

# Builds an installable, unsigned debug APK - no Play Store / App Store needed.
# Runs automatically on every push to main, and can also be triggered manually
# from the "Actions" tab in GitHub ("Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      # If you've added a GOOGLE_SERVICES_JSON repository secret (base64-encoded
      # contents of your real Firebase google-services.json), this overwrites the
      # placeholder file with your real config so push notifications work in the
      # built APK. Without the secret, the build still succeeds using the
      # checked-in placeholder (push notifications just won't be functional).
      - name: Inject real google-services.json (if configured)
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dw-personal-trainer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
